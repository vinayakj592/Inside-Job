<!doctype html>
<html lang="en" style="background:#07090b">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07090b">
  <title>Inside Job</title>
  <meta name="description" content="A noir heist game where SQL is your lockpick.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Critical boot styles, inlined so the very first frame is ink, never a white unstyled page.
       Everything else loads with the app bundle. -->
  <style>
    html, body { margin: 0; height: 100%; background: #07090b; color: #ece2c9; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    .boot { position: fixed; inset: 0; z-index: 200; background: #07090b; display: grid; place-content: center; gap: 26px; transition: opacity .6s ease; }
    .boot.is-done { opacity: 0; pointer-events: none; }
    .boot__mark { font: 900 72px/.82 'Big Shoulders Stencil Display', sans-serif; letter-spacing: .02em; color: #ece2c9; text-align: center; text-transform: uppercase;
      text-shadow: -3px 2px 0 #176068, 2px -1px 0 rgba(242,169,59,.6); opacity: 0; transform: translateY(6px); transition: opacity .5s ease, transform .5s ease; }
    .boot__mark span { display: block; color: #f2a93b; }
    .boot.is-fonts .boot__mark { opacity: 1; transform: none; }
    .boot__bar { width: 180px; height: 2px; background: #1f2b30; overflow: hidden; margin: 0 auto; }
    .boot__bar i { display: block; height: 100%; width: 35%; background: #f2a93b; animation: boot-bar 1.1s ease-in-out infinite; }
    @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
    @media (prefers-reduced-motion: reduce) { .boot, .boot__mark { transition: none; } .boot__bar i { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true"><div class="boot__mark">INSIDE<span>JOB</span></div><div class="boot__bar"><i></i></div></div>
  <main id="stage" aria-live="polite"></main>
  <div id="fx-layer"></div>
  <div id="overlay-layer"></div>
  <div id="toast-layer"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
